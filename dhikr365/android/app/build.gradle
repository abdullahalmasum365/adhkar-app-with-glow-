plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Release signing — reads from android/key.properties (gitignored).
// Fails release builds immediately with an actionable error if key.properties or keystore is missing,
// rather than silently falling back to the debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (isReleaseBuild) {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException(
                "\n========================================================================\n" +
                "RELEASE BUILD FAILED: 'android/key.properties' is missing!\n" +
                "Release builds require valid signing credentials and will not fall back\n" +
                "to the debug key.\n" +
                "Please copy 'android/key.properties.example' to 'android/key.properties'\n" +
                "and configure your release keystore parameters.\n" +
                "========================================================================"
            )
        }
        def rawStoreFile = keystoreProperties["storeFile"]
        if (!rawStoreFile) {
            throw new GradleException(
                "RELEASE BUILD FAILED: 'storeFile' is not specified in android/key.properties."
            )
        }
        def resolvedStore = file(rawStoreFile).exists() ? file(rawStoreFile) : rootProject.file(rawStoreFile)
        if (!resolvedStore.exists()) {
            throw new GradleException(
                "RELEASE BUILD FAILED: Keystore file '${rawStoreFile}' specified in android/key.properties was not found."
            )
        }
    }
}

android {
    namespace = "com.adhkaar365.app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.adhkaar365.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                def rawStoreFile = keystoreProperties["storeFile"]
                if (rawStoreFile) {
                    storeFile = file(rawStoreFile).exists() ? file(rawStoreFile) : rootProject.file(rawStoreFile)
                }
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
